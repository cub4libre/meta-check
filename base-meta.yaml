# ==========================================================
# 基础端口与运行模式
# 对齐：usbog232/clashmetadingyue/base-meta.yaml
# 微调：国内 DNS 优先 + nameserver-policy，便于启用 DNS 代理后访问国内站
# ==========================================================
mixed-port: 7890
redir-port: 7892
tproxy-port: 7893

allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: false
udp: true

unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

# ==========================================================
# DNS（Fake-IP，适配 TUN / Mixed / DNS 代理）
# ==========================================================
dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: false
  respect-rules: true

  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.localdomain'
    - 'localhost'
    - 'time.*'
    - 'ntp.*'
    - 'time.windows.com'
    - 'time.apple.com'
    - 'time.cloudflare.com'
    - 'router.asus.com'
    - 'routerlogin.net'

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 国内优先（原版把 CF 放进 nameserver，易导致国内解析异常）
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    - 223.5.5.5
    - 119.29.29.29

  fallback:
    - https://dns.cloudflare.com/dns-query
    - tls://1.1.1.1:853
    - tls://8.8.8.8:853

  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - gfw
    ipcidr:
      - 240.0.0.0/4

  nameserver-policy:
    "geosite:private,cn,google-cn":
      - 223.5.5.5
      - 119.29.29.29
      - https://dns.alidns.com/dns-query

# ==========================================================
# TUN
# ==========================================================
tun:
  enable: true
  stack: system
  auto-route: true
  auto-detect-interface: true
  strict-route: false
  dns-hijack:
    - any:53

# ==========================================================
# GEO（testingcf，降低 GitHub TLS 失败）
# ==========================================================
geodata-mode: true
geox-url:
  geoip: "https://testingcf.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]

experimental:
  sniff-tls-sni: true
  sniff-http-host: true
