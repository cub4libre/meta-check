custom_proxy_group=🐟 遵循规则`select`[]🐟 漏网之鱼

; ==========================================================
; 5) 国家 / 冷门测速组（正则与冷门排除对齐）
; ==========================================================
custom_proxy_group=🧭 手动选择`select`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇭🇰 HK`url-test`(?i)(🇭🇰|香港|\\bHK\\b|hong\\s*kong|hongkong)`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇹🇼 TW`url-test`(?i)(🇹🇼|台湾|台灣|\\bTW\\b|taiwan|taipei|hinet)`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇯🇵 JP`url-test`(?i)(🇯🇵|日本|\\bJP\\b|japan|tokyo|osaka)`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇸🇬 SG`url-test`(?i)(🇸🇬|新加坡|\\bSG\\b|singapore)`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇺🇸 US`url-test`(?i)(🇺🇸|美国|美國|\\bUS\\b|united\\s*states|los\\s*angeles|san\\s*jose|seattle|new\\s*york)`https://www.gstatic.com/generate_204`300,,50
; 冷门：排除与五区相同的关键词，避免节点两边落空
custom_proxy_group=🧊 冷门节点`url-test`(?i)^(?!.*(🇭🇰|香港|\\bHK\\b|hong\\s*kong|hongkong|🇯🇵|日本|\\bJP\\b|japan|tokyo|osaka|🇹🇼|台湾|台灣|\\bTW\\b|taiwan|taipei|hinet|🇸🇬|新加坡|\\bSG\\b|singapore|🇺🇸|美国|美國|\\bUS\\b|united\\s*states|los\\s*angeles|san\\s*jose|seattle|new\\s*york)).*`https://www.gstatic.com/generate_204`300,,50
